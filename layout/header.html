<a class="skip-link" href="#main">{{skipLink}}</a>
<header class="site-header">
  <div class="container">
    <a class="brand" href="{{homeHref}}">
      <img src="/assets/images/logo-icon.svg" alt="" width="32" height="32">
      <span>Flat Feet Shoe Guide<span class="brand-sub">{{tagline}}</span></span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="main-nav">
      <span class="bar"></span>
      <span class="visually-hidden">{{menu}}</span>
    </button>
    <nav class="main-nav" id="main-nav" aria-label="{{navLabel}}">
      <ul class="main-nav-list">
{{navItems}}
        <li class="nav-cta-item"><a class="btn btn-primary btn-sm nav-cta" href="{{ctaHref}}">{{ctaLabel}}</a></li>
        <li class="lang-switcher-item">
          <button type="button" class="lang-switcher-toggle" id="lang-switcher-btn" aria-expanded="false" aria-haspopup="true" aria-controls="lang-switcher-menu" data-disclosure>
            <span class="visually-hidden">{{languageLabel}}: </span><span class="lang-switcher-current">{{currentLangCode}}</span>
            <svg width="10" height="6" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <ul class="lang-switcher-menu" id="lang-switcher-menu" hidden>
{{langMenu}}
          </ul>
        </li>
      </ul>
    </nav>
  </div>
</header>
