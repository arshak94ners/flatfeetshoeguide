<footer class="site-footer">
  <div class="container">
    <div class="footer-grid">
      <div class="footer-brand">
        <a class="footer-logo" href="{{homeHref}}">
          <img src="/assets/images/logo-icon.svg" alt="" width="28" height="28" loading="lazy">
          <span>Flat Feet Shoe Guide</span>
        </a>
        <p>{{footerBlurb}}</p>
        <p class="footer-note">{{footerNotMedical}}</p>
        <a class="btn btn-primary btn-sm" href="{{ctaHref}}">{{ctaLabel}}</a>
      </div>
{{footerColumns}}
    </div>
    <div class="footer-bottom">
      <p>&copy; {{year}} Flat Feet Shoe Guide. {{rights}}</p>
      <p>{{associates}}</p>
      <ul class="footer-langs" aria-label="{{languageLabel}}">
{{langLinks}}
      </ul>
    </div>
  </div>
</footer>
<a href="#main" class="back-to-top" aria-label="{{backToTop}}">↑</a>
<script src="{{asset:/assets/js/main.js}}" defer></script>
